<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>OMO 项目能力</title><link rel="stylesheet" href="./panel.css"></head>
<body><main>
  <header><div><h1>OMO Coworkers · 设置</h1></div><button id="refresh" type="button">刷新</button></header>
  <p id="notice" role="status" aria-live="polite"></p>
  <div id="leave" class="callout" hidden><strong>有尚未保存的设置</strong><p>继续编辑，或明确放弃后离开。</p><div class="actions"><button id="stay">继续编辑</button><button id="discard-leave">放弃并离开</button></div></div>
  <div class="workspace" id="workspace">
    <nav id="list" aria-label="项目能力"><p class="muted">正在读取能力…</p></nav>
    <section id="detail" aria-label="能力设置"><p class="empty">选择一项能力，查看项目内容与可用设置。</p></section>
  </div>
  <section id="confirmation" class="callout" hidden aria-labelledby="confirm-title">
    <h2 id="confirm-title" tabindex="-1">确认本次修改</h2><div id="summary"></div><p id="expiry" class="muted"></p><div id="risk"></div>
    <div class="actions"><button id="commit" class="primary">确认保存</button><button id="cancel-preview">返回设置</button></div>
  </section>
  <details class="support"><summary>环境、扩展与恢复</summary>
    <p class="muted">编辑默认 HOME/XDG 候选目录，不代表运行中实例正在使用它。自定义根暂不支持。服务使用宿主 Node 权限，不是操作系统沙箱。</p>
    <div id="diagnostics"></div><div id="guard"></div>
    <details><summary>最近修改与恢复</summary><p class="muted">最近十次，无时间期限；撤销先预览，冲突或容量不足会停止。</p><div id="history"></div><div id="recovery"></div></details>
    <p class="muted">其他 OMO 配置不会在此编辑；当前服务未提供其只读摘要。</p>
  </details>
  <footer>保存不等于运行中生效。需要时通过宿主 UI 重载并核对新会话；这里不切换会话、不自动重启。</footer>
</main><script type="module" src="./app.js"></script></body></html>
