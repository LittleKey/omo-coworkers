<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OMO 配置工作台</title><link rel="stylesheet" href="./panel.css"></head>
<body>
<div class="shell" id="app">
  <header><nav aria-label="工作台"><button id="tab-roles" aria-current="page">角色</button><button id="tab-settings">设置</button></nav><span class="target">全局 OMO <span id="reload" class="badge" hidden>待重载</span></span></header>
  <div id="banner" class="banner" role="status" hidden></div>
  <div id="roles-view" class="layout"><aside class="sidebar"><input id="role-search" type="search" aria-label="搜索角色" placeholder="搜索角色"><nav id="list" aria-label="角色列表"></nav></aside><main class="detail" id="detail"><p class="muted">正在连接工作台…</p></main></div>
  <main id="settings-view" class="settings" hidden></main>
  <footer><span id="status" role="status">正在连接…</span><button id="retry" hidden>重试保存</button><button id="restore" disabled>还原草稿</button><button id="publish" class="primary" disabled>发布</button></footer>
</div>
<dialog id="picker" aria-labelledby="picker-title"><div class="heading"><h1 id="picker-title">选择模型</h1><button id="picker-close">关闭</button></div><div class="row"><input id="search" type="search" aria-label="搜索模型" placeholder="搜索完整模型 ID"><button id="refresh" aria-label="重新连接模型目录">↻</button></div><small id="cache-status"></small><div id="options"></div></dialog>
<dialog id="review" aria-labelledby="review-title"><h1 id="review-title">发布预览</h1><div id="diffs"></div><div id="risk"></div><small>仅覆盖扩展托管项，保留其余配置与 opencode.json</small><div class="dialog-actions"><button id="cancel">取消</button><button id="confirm" class="primary">确认发布</button></div></dialog>
<dialog id="data-dialog" aria-labelledby="data-title"><h1 id="data-title"></h1><pre id="data-text"></pre><div class="dialog-actions"><button id="data-close">取消</button><button id="data-confirm" class="primary" hidden>确认</button></div></dialog>
<dialog id="import-dialog" aria-labelledby="import-title"><h1 id="import-title">导入配置备份</h1><label for="import-text">粘贴工作台 JSON 备份（最多 60 KB）</label><textarea id="import-text" rows="10" maxlength="60000"></textarea><small>仅保存私有草稿，由服务端验证。未完成输入仅作备份，不导入为有效配置；不会写入原生文件。</small><p id="import-error" role="alert"></p><div class="dialog-actions"><button id="import-close">取消</button><button id="import-confirm" class="primary">检查并导入</button></div></dialog>
<script type="module" src="./app.js"></script>
</body></html>
